<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle da Lona</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Biblioteca MQTT -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 280px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h2 {
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
    }

    .subir { background: #2ecc71; }
    .descer { background: #3498db; }
    .parar { background: #e74c3c; }

    button:active {
      opacity: 0.8;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Controle da Lona</h2>

    <button class="subir" onclick="enviar('subir')">
      ⬆ Subir
    </button>

    <button class="descer" onclick="enviar('descer')">
      ⬇ Descer
    </button>

    <button class="parar" onclick="enviar('parar')">
      ⏹ Parar
    </button>

    <div id="status" class="status">
      Conectando...
    </div>
  </div>

  <script>
    // 🔌 Conectar ao HiveMQ via WebSocket seguro
    const client = mqtt.connect(
      "wss://8f0ac621d63a4816bbbc077a0be45d7d.s1.eu.hivemq.cloud:8884/mqtt",
      {
        username: "PedroPizoni",
        password: "12121974Pe!",
        clean: true,
        reconnectPeriod: 1000
      }
    );

    const statusEl = document.getElementById("status");

    client.on("connect", () => {
      console.log("Conectado ao HiveMQ");
      statusEl.textContent = "🟢 Conectado";
      statusEl.style.color = "#2ecc71";
    });

    client.on("reconnect", () => {
      statusEl.textContent = "🟡 Reconectando...";
      statusEl.style.color = "#f1c40f";
    });

    client.on("error", err => {
      console.error("Erro MQTT:", err);
      statusEl.textContent = "🔴 Erro de conexão";
      statusEl.style.color = "#e74c3c";
    });

    // 📤 Enviar comando
    function enviar(acao) {

      if (!client.connected) {
        alert("Ainda não conectado ao servidor.");
        return;
      }

      const payload = JSON.stringify({
        acao,
        timestamp: Date.now()
      });

      client.publish("lona/controle", payload, { qos: 1 });

      console.log("Comando enviado:", acao);
    }
  </script>

</body>
</html>
